<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classiee ESP32 Portal</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <section class="card login-card">
      <h1>Classiee</h1>
      <p class="muted">Student Login</p>
      <h2>Log In</h2>
      <form id="loginPost" method="post">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
      </form>
      <p class="hint">Backend URL: <input id="backendBase" type="text" style="width:60%;display:inline-block;margin-left:8px;" placeholder="https://your-backend.example.com"><button id="saveBackend" style="width:auto;margin-left:8px;">Save</button></p>
    </section>
  </main>
</body>
</html>
